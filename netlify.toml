[build]
  publish = "deploy"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# A identificação por visão pode levar alguns segundos.
[functions."identify-card"]
  timeout = 26

# Os módulos JS são versionados por query-string (?v=) no index.html,
# então podem ser cacheados agressivamente.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
